<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>A lista — arrecadação presidencial 2026 · DecideBrasil</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

<style>
  :root {
    --bg: #f0f0f0;
    --card: #fff;
    --text: #3c3c3c;
    --muted: #8a8a8a;
    --line: #eeeef0;
    --blue: #2150e8;
    --edge: #e0e0e0;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Hanken Grotesk", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .page { max-width: 1180px; margin: 0 auto; padding: 28px 20px 48px; }
  .brand {
    display: flex; align-items: baseline; gap: 12px; margin: 0 4px 14px;
  }
  .brand b { color: var(--blue); font-weight: 800; font-size: 15px; letter-spacing: -0.2px; }
  .brand span { color: var(--muted); font-size: 14px; }
  .brand a { margin-left: auto; color: var(--blue); font-size: 14px; font-weight: 700; text-decoration: none; }
  .brand a:hover { text-decoration: underline; }
  .card {
    background: var(--card);
    border-radius: 12px;
    box-shadow: 0px 3.54px 13.88px 2.78px rgba(0,0,0,0.18);
    overflow: hidden;
  }
  .head {
    display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
    padding: 22px 22px 6px;
  }
  h1 {
    margin: 0;
    font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -0.3px;
  }
  .sub { margin: 6px 0 0; max-width: 640px; color: var(--muted); font-size: 15px; line-height: 1.35; }
  .tools { display: flex; align-items: center; gap: 10px; flex-shrink: 0; padding-top: 4px; }
  .sort {
    display: flex; align-items: center; gap: 8px;
    height: 36px; padding: 0 6px 0 12px;
    border: 1px solid var(--edge); border-radius: 999px; background: #fff;
  }
  .sort span { color: var(--muted); font-size: 13px; font-weight: 500; }
  select, input[type="search"] {
    font-family: inherit; color: var(--text); background: #fff; border: 0; outline: none;
  }
  select { font-size: 14px; font-weight: 600; padding-right: 4px; }
  .dir {
    width: 26px; height: 26px; border: 0; border-radius: 999px; background: var(--bg);
    color: var(--text); font-size: 14px; cursor: pointer;
  }
  .dir[aria-pressed="true"] { background: var(--blue); color: #fff; }
  input[type="search"] {
    height: 36px; width: 180px; padding: 0 14px;
    border: 1px solid var(--edge); border-radius: 999px; font-size: 14px;
  }
  .rows { padding-bottom: 6px; }
  .row {
    display: grid;
    grid-template-columns: 36px 76px minmax(190px, 1.05fr) minmax(220px, 1.25fr) 158px 158px;
    gap: 8px 14px; align-items: center;
    padding: 16px 22px;
    border-top: 1px solid var(--line);
  }
  .rank {
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 500; font-size: 18px; color: var(--muted);
  }
  .row:first-child .rank { color: var(--text); font-weight: 700; }
  .who { display: flex; align-items: center; gap: 0; }
  .avatar {
    width: 68px; height: 68px; border-radius: 50%; object-fit: cover; background: #f0f0f0;
    border-style: solid;
  }
  .fallback {
    width: 68px; height: 68px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: #fff; background: #909eb1;
  }
  .id .urna { margin: 0; font-size: 22px; line-height: 1.1; font-weight: 700; letter-spacing: -0.3px; }
  .id .urna a { color: inherit; text-decoration: none; }
  .id .urna a:hover { color: var(--blue); }
  .id .civil { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .id .meta { margin: 3px 0 0; color: var(--muted); font-size: 13px; }
  .chip {
    display: inline-block; margin-left: 6px; vertical-align: 2px;
    border: 1px solid var(--blue); color: var(--blue);
    border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 700;
    letter-spacing: 0;
  }
  .metric .k { margin: 0; color: var(--muted); font-size: 12px; font-weight: 500; }
  .metric .v {
    margin: 1px 0 0;
    font-family: "JetBrains Mono", ui-monospace, monospace;
    font-weight: 700; font-size: 26px; letter-spacing: -0.6px; line-height: 1.15;
  }
  .metric .note { margin: 1px 0 4px; min-height: 14px; color: var(--muted); font-size: 11px; }
  .metric.side .v { font-size: 16px; letter-spacing: -0.3px; }
  .metric.side .pct {
    margin: 2px 0 0; font-family: "JetBrains Mono", ui-monospace, monospace;
    font-size: 13px; font-weight: 500; color: var(--text); white-space: nowrap;
  }
  .metric.side .pct.zero { color: var(--muted); }
  svg.spark { display: block; width: 100%; height: 46px; }
  .empty { padding: 28px 22px 32px; color: var(--muted); }
  footer {
    margin: 14px 6px 0; color: var(--muted); font-size: 12px; line-height: 1.45;
  }
  footer a { color: var(--muted); }
  @media (max-width: 980px) {
    h1 { font-size: 22px; }
    .head { flex-direction: column; }
    .tools { width: 100%; }
    input[type="search"] { flex: 1; width: auto; }
    .row {
      grid-template-columns: 28px 64px 1fr;
      grid-template-areas: "rank photo id" "spark spark spark" "week week gasto";
    }
    .rank { grid-area: rank; }
    .who { grid-area: photo; }
    .id { grid-area: id; }
    .m-rec { grid-area: spark; }
    .m-week { grid-area: week; }
    .m-gasto { grid-area: gasto; }
    .avatar, .fallback { width: 56px; height: 56px; }
    .metric .v { font-size: 22px; }
  }
</style>
</head>

<script>
const DATA = JSON.parse(document.getElementById("dados").textContent);
const ordemEl = document.getElementById("ordem");
const dirEl = document.getElementById("direcao");
const buscaEl = document.getElementById("busca");
let desc = true;

function brl(n) {
  const sign = n < 0 ? "−" : "";
  const a = Math.abs(n);
  if (a >= 1e6) {
    return sign + "R$ " + (a / 1e6).toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + " mi";
  }
  if (a >= 1000) {
    const v = a / 1000;
    const d = v >= 100 ? 0 : 1;
    return sign + "R$ " + v.toLocaleString("pt-BR", { minimumFractionDigits: d, maximumFractionDigits: d }) + " mil";
  }
  if (a < 0.5) return "R$ 0";
  return sign + "R$ " + a.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
}
function pct1(n) {
  return n.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "%";
}
function variacao(semana, total) {
  const prev = total - semana;
  if (semana < 1000) return { texto: "0%", zero: true };
  if (prev <= 0) return { texto: "—", zero: true };
  const p = 100 * semana / prev;
  if (p < 0.05) return { texto: "0%", zero: true };
  return { texto: "+" + pct1(p), zero: false };
}
function tetoPct(c) {
  if (!c.teto) return "—";
  const p = 100 * c.gasto / c.teto;
  const s = p >= 10
    ? p.toLocaleString("pt-BR", { maximumFractionDigits: 0 })
    : p.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 });
  const cap = c.segundo ? "133 mi" : "88,9 mi";
  return s + "% de " + cap;
}
function spark(serie) {
  const w = 240, h = 46, pad = 4;
  const max = Math.max(...serie, 0);
  const n = serie.length;
  if (max <= 0) {
    return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><line x1="' + pad + '" y1="' + (h - pad) + '" x2="' + (w - pad) + '" y2="' + (h - pad) + '" stroke="#c8c8c8" stroke-width="1.75" stroke-linecap="round"/></svg>';
  }
  const pts = serie.map((v, i) => {
    const x = pad + (i / (n - 1)) * (w - 2 * pad);
    const y = h - pad - (v / max) * (h - 2 * pad);
    return [x, y];
  });
  const d = pts.map((p, i) => (i ? "L" : "M") + p[0].toFixed(1) + "," + p[1].toFixed(1)).join("");
  const last = pts[pts.length - 1];
  return '<svg class="spark" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true"><path d="' + d + '" fill="none" stroke="#3c3c3c" stroke-width="1.75" stroke-linejoin="round" stroke-linecap="round"/><circle cx="' + last[0].toFixed(1) + '" cy="' + last[1].toFixed(1) + '" r="3.2" fill="#3c3c3c"/></svg>';
}
function iniciais(nome) {
  return nome.split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
}
function linha(c, i) {
  const chip = c.segundo ? '<span class="chip">2º turno</span>' : "";
  const dinheiro = c.estimavel / Math.max(c.receita, 1) >= 0.05
    ? brl(c.financeiro) + " em dinheiro"
    : "";
  const vari = variacao(c.semana, c.receita);
  const semanaTxt = c.semana >= 1000 ? "+" + brl(c.semana) : brl(0);
  return '<div class="row">'
    + '<div class="rank">' + (i + 1) + '</div>'
    + '<div class="who"><img class="avatar" style="border-width:3px;border-color:' + c.cor + '" src="' + c.foto + '" alt="" data-ini="' + iniciais(c.urna) + '" data-cor="' + c.cor + '"></div>'
    + '<div class="id"><p class="urna"><a href="' + c.url + '" target="_blank" rel="noopener">' + c.urna + '</a>' + chip + '</p>'
    + '<p class="civil">' + c.nome + '</p>'
    + '<p class="meta">' + c.partido + ' · nº ' + c.numero + ' · ' + c.fonte + '</p></div>'
    + '<div class="metric m-rec"><p class="k">Arrecadação</p><p class="v">' + brl(c.receita) + '</p><p class="note">' + dinheiro + '</p>' + spark(c.serie) + '</div>'
    + '<div class="metric side m-week"><p class="k">Últimos 7 dias</p><p class="v">' + semanaTxt + '</p><p class="pct' + (vari.zero ? ' zero' : '') + '">' + vari.texto + '</p></div>'
    + '<div class="metric side m-gasto"><p class="k">Gasto contratado</p><p class="v">' + brl(c.gasto) + '</p><p class="pct">' + tetoPct(c) + '</p></div>'
    + '</div>';
}
function desenha() {
  const q = buscaEl.value.trim().toLocaleLowerCase("pt-BR");
  const key = ordemEl.value;
  const lista = DATA.candidatos.filter(c => {
    if (!q) return true;
    const blob = (c.urna + " " + c.nome + " " + c.partido + " " + c.numero).toLocaleLowerCase("pt-BR");
    return blob.includes(q);
  });
  const valor = c => key === "teto" ? c.gasto / c.teto : c[key];
  lista.sort((a, b) => desc ? valor(b) - valor(a) : valor(a) - valor(b));
  const box = document.getElementById("rows");
  box.innerHTML = lista.length
    ? lista.map(linha).join("")
    : '<p class="empty">Nenhuma candidatura com esse nome, partido ou número.</p>';
  box.querySelectorAll("img.avatar").forEach(img => {
    img.addEventListener("error", () => {
      const s = document.createElement("div");
      s.className = "fallback";
      s.style.background = img.dataset.cor;
      s.textContent = img.dataset.ini;
      img.replaceWith(s);
    });
  });
}
document.getElementById("titulo").textContent =
  "Lula e Flávio declaram " + DATA.top2.toLocaleString("pt-BR", { minimumFractionDigits: 1, maximumFractionDigits: 1 }) + "% do dinheiro da campanha presidencial.";
document.getElementById("sub").textContent =
  "Arrecadação declarada, de " + DATA.de + " a " + DATA.ate + ". A linha é o acumulado de cada campanha, na escala dela: mostra quando o dinheiro entrou, não o tamanho. O tamanho está no número.";
document.getElementById("fonte").innerHTML =
  "Fonte · TSE, prestação de contas eleitorais de candidatos 2026, arquivo gerado em " + DATA.gerado + " às " + DATA.hora +
  ". Presidente, Brasil. Receitas idênticas contam uma vez. Nas despesas, se uma linha do mesmo lançamento é a soma das outras, fica só a soma. " +
  "Últimos 7 dias: receita com data de " + DATA.semanaDe + " a " + DATA.ate + ", em relação ao que já havia entrado. Abaixo de R$ 1 mil na semana, a coluna mostra zero. " +
  "Teto usado na conta: R$ 88,9 milhões no 1º turno e R$ 133,4 milhões para quem disputou o 2º, o valor arredondado que a imprensa registrou a partir do TSE. " +
  "Contas parciais: a prestação final do 1º turno segue aberta até 3 de novembro. " +
  '<a href="https://dadosabertos.tse.jus.br/dataset/prestacao-de-contas-eleitorais-2026">Dados abertos do TSE</a>. ' +
  'Ficha de Lula no <a href="https://divulgacandcontas.tse.jus.br/divulga/#/candidato/BR/BR/20322002026/280002542548/2026/BR">DivulgaCand</a>.';
ordemEl.addEventListener("change", desenha);
buscaEl.addEventListener("input", desenha);
dirEl.addEventListener("click", () => {
  desc = !desc;
  dirEl.textContent = desc ? "↓" : "↑";
  dirEl.setAttribute("aria-pressed", desc ? "true" : "false");
  dirEl.setAttribute("aria-label", desc ? "Ordem decrescente" : "Ordem crescente");
  desenha();
});
desenha();
</script>
